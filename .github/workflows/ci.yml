name: CI

on:
  push:
    branches: ["main", "work"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Make install.sh executable
        if: ${{ hashFiles('install.sh') != '' }}
        run: chmod +x ./install.sh

      - name: Run install.sh
        if: ${{ hashFiles('install.sh') != '' }}
        run: ./install.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: |
          ruff check src tests

      - name: Test
        run: |
          pytest -q

  license-compliance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify no GPL text
        run: ./verify-no-gpl.sh
