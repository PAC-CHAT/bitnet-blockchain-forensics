version: "3.8"

services:
  bitnet-forensics:
    build: .
    container_name: bitnet-blockchain-forensics
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
